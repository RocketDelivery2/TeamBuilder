name: Dependabot Auto Merge

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  approve-and-enable:
    name: Approve and enable auto-merge
    runs-on: ubuntu-latest

    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98
        with:
          github-token: ${{ github.token }}

      - name: Decide and enable auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.event.repository.full_name }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          DRAFT: ${{ github.event.pull_request.draft }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          DEPENDENCY_NAMES: ${{ steps.metadata.outputs.dependency-names }}
        run: |
          set -euo pipefail

          owner="${REPO%/*}"
          name="${REPO#*/}"

          pr_json="$(gh api graphql \
            -f owner="$owner" \
            -f name="$name" \
            -F number="$PR_NUMBER" \
            -f query='query($owner:String!, $name:String!, $number:Int!) { repository(owner:$owner, name:$name) { pullRequest(number:$number) { id autoMergeRequest { enabledAt } } } }')"

          pr_id="$(jq -r '.data.repository.pullRequest.id' <<<"$pr_json")"
          auto_merge_enabled="$(jq -r '.data.repository.pullRequest.autoMergeRequest.enabledAt // empty' <<<"$pr_json")"

          {
            echo "## Dependabot auto-merge decision"
            echo ""
            echo "- PR: #${PR_NUMBER}"
            echo "- Base ref: ${BASE_REF}"
            echo "- Author: ${AUTHOR}"
            echo "- Head repo: ${HEAD_REPO}"
            echo "- Base repo: ${BASE_REPO}"
            echo "- Draft: ${DRAFT}"
            echo "- Update type: ${UPDATE_TYPE}"
            echo "- Dependencies: ${DEPENDENCY_NAMES}"
            echo "- Auto-merge already enabled: ${auto_merge_enabled}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$BASE_REF" != "main" ]]; then
            echo "Skipping: base ref is not main." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [[ "$AUTHOR" != "dependabot[bot]" ]]; then
            echo "Skipping: author is not dependabot[bot]." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [[ "$DRAFT" == "true" ]]; then
            echo "Skipping: draft pull request." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [[ "$HEAD_REPO" != "$BASE_REPO" ]]; then
            echo "Skipping: fork pull request is not eligible for Dependabot auto-merge." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [[ "$UPDATE_TYPE" == "version-update:semver-minor" || "$UPDATE_TYPE" == "version-update:semver-patch" ]]; then
            gh pr review "$PR_NUMBER" --repo "$REPO" --approve
            echo "Approved patch/minor Dependabot update." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Skipped approval: update type '${UPDATE_TYPE}' is not patch or minor." >> "$GITHUB_STEP_SUMMARY"
          fi

          if [[ "$auto_merge_enabled" == "true" ]]; then
            echo "Auto-merge is already enabled." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          gh api graphql \
            -f pullRequestId="$pr_id" \
            -f query='mutation($pullRequestId:ID!) { enablePullRequestAutoMerge(input: { pullRequestId: $pullRequestId, mergeMethod: SQUASH }) { pullRequest { id } } }' \
            >/dev/null

          echo "Enabled squash auto-merge." >> "$GITHUB_STEP_SUMMARY"
