name: Dependabot Auto Merge

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  # enablePullRequestAutoMerge needs contents: write; with only
  # contents: read it failed with "Resource not accessible by integration".
  # This job never checks out or runs code from the pull request.
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  approve-and-enable:
    name: Enable Dependabot auto-merge
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98
        with:
          github-token: ${{ github.token }}

      - name: Decide and enable auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.event.repository.full_name }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          DRAFT: ${{ github.event.pull_request.draft }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          DEPENDENCY_NAMES: ${{ steps.metadata.outputs.dependency-names }}
        run: |
          set -euo pipefail

          owner="${REPO%/*}"
          name="${REPO#*/}"

          pr_json="$(gh api graphql \
            -f owner="$owner" \
            -f name="$name" \
            -F number="$PR_NUMBER" \
            -f query='query($owner:String!, $name:String!, $number:Int!) { repository(owner:$owner, name:$name) { pullRequest(number:$number) { id autoMergeRequest { enabledAt } } } }')"

          pr_id="$(jq -r '.data.repository.pullRequest.id' <<<"$pr_json")"
          auto_merge_enabled="$(jq -r '.data.repository.pullRequest.autoMergeRequest.enabledAt // empty' <<<"$pr_json")"

          {
            echo "## Dependabot auto-merge decision"
            echo ""
            echo "- PR: #${PR_NUMBER}"
            echo "- Base ref: ${BASE_REF}"
            echo "- Author: ${AUTHOR}"
            echo "- Head repo: ${HEAD_REPO}"
            echo "- Base repo: ${BASE_REPO}"
            echo "- Draft: ${DRAFT}"
            echo "- Update type: ${UPDATE_TYPE}"
            echo "- Dependencies: ${DEPENDENCY_NAMES}"
            echo "- Auto-merge already enabled: ${auto_merge_enabled}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$BASE_REF" != "main" ]]; then
            echo "Skipping: base ref is not main." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [[ "$AUTHOR" != "dependabot[bot]" ]]; then
            echo "Skipping: author is not dependabot[bot]." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [[ "$DRAFT" == "true" ]]; then
            echo "Skipping: draft pull request." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [[ "$HEAD_REPO" != "$BASE_REPO" ]]; then
            echo "Skipping: fork pull request is not eligible for Dependabot auto-merge." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # No bot approval: github-actions[bot] approving a PR with this
          # repository's own token is self-approval presented as a review,
          # and the main ruleset does not require an approving review.
          if [[ "$UPDATE_TYPE" != "version-update:semver-minor" && "$UPDATE_TYPE" != "version-update:semver-patch" ]]; then
            echo "Skipping: update type '${UPDATE_TYPE}' is not patch or minor; merge it by hand after review." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Native auto-merge only waits for the checks the main ruleset
          # requires. Until the Reviewer Agent is one of them, arming it here
          # would let a Dependabot PR merge without the Reviewer Agent gate
          # that pr-auto-merge.yml applies to every other PR.
          if ! gh api "repos/${REPO}/rules/branches/main" \
            --jq '[.[] | select(.type == "required_status_checks") | .parameters.required_status_checks[]?.context] | index("Reviewer Agent") != null' \
            | grep -qx true; then
            echo "Skipping: 'Reviewer Agent' is not a required status check on main, so auto-merge would bypass it. See docs/branch-protection.md." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [[ -n "$auto_merge_enabled" ]]; then
            echo "Auto-merge is already enabled." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          mutation_json="$(gh api graphql \
            -f pullRequestId="$pr_id" \
            -f query='mutation($pullRequestId:ID!) { enablePullRequestAutoMerge(input: { pullRequestId: $pullRequestId, mergeMethod: SQUASH }) { pullRequest { id } } }')"

          if ! jq -e '((.errors // []) | length == 0) and ((.data.enablePullRequestAutoMerge.pullRequest.id // "") | length > 0)' <<<"$mutation_json" >/dev/null; then
            echo "Auto-merge mutation response was missing or contained GraphQL errors; the job failed closed." >> "$GITHUB_STEP_SUMMARY"
            echo "::error::GraphQL did not confirm enabling Dependabot auto-merge; no success was reported."
            exit 1
          fi

          auto_merge_confirmed=false
          for attempt in 1 2 3 4; do
            verification_json="$(gh api graphql \
              -f owner="$owner" \
              -f name="$name" \
              -F number="$PR_NUMBER" \
              -f query='query($owner:String!, $name:String!, $number:Int!) { repository(owner:$owner, name:$name) { pullRequest(number:$number) { autoMergeRequest { enabledAt } } } }')"

            if jq -e '((.errors // []) | length == 0) and (.data.repository.pullRequest.autoMergeRequest.enabledAt != null)' <<<"$verification_json" >/dev/null; then
              auto_merge_confirmed=true
              break
            fi

            if [[ "$attempt" -lt 4 ]]; then
              sleep "$attempt"
            fi
          done

          if [[ "$auto_merge_confirmed" != "true" ]]; then
            echo "Auto-merge read-back did not confirm enabled state after four attempts; the job failed closed." >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Dependabot auto-merge was not enabled after the GraphQL mutation; refusing to report success."
            exit 1
          fi

          echo "Enabled squash auto-merge; GitHub merges once every required check, including the Reviewer Agent, passes." >> "$GITHUB_STEP_SUMMARY"
