name: Trusted PR Auto-Merge

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  enable-auto-merge:
    name: Enable squash auto-merge
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request.base.ref == 'main' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.event.repository.full_name &&
      contains(fromJson('["RocketDelivery2","Copilot"]'), github.event.pull_request.user.login)

    steps:
      - name: Decide eligibility and enable auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          DRAFT: ${{ github.event.pull_request.draft }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail

          owner="${BASE_REPO%%/*}"
          repo="${BASE_REPO##*/}"

          pr_json="$(gh api graphql \
            -f owner="$owner" \
            -f repo="$repo" \
            -f number="$PR_NUMBER" \
            -f query='query($owner:String!, $repo:String!, $number:Int!) { repository(owner:$owner, name:$repo) { pullRequest(number:$number) { id autoMergeRequest { enabledAt } } } }')"

          pr_id="$(jq -r '.data.repository.pullRequest.id' <<<"$pr_json")"
          auto_merge_enabled="$(jq -r '.data.repository.pullRequest.autoMergeRequest.enabledAt // empty' <<<"$pr_json")"

          {
            echo "## Trusted PR auto-merge decision"
            echo ""
            echo "- PR: #${PR_NUMBER}"
            echo "- Author: ${AUTHOR}"
            echo "- Draft: ${DRAFT}"
            echo "- Head repo: ${HEAD_REPO}"
            echo "- Base repo: ${BASE_REPO}"
            echo "- Auto-merge already enabled: ${auto_merge_enabled:-false}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ -n "$auto_merge_enabled" ]]; then
            echo "Auto-merge is already enabled." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          gh api graphql \
            -f pullRequestId="$pr_id" \
            -f query='mutation($pullRequestId:ID!) { enablePullRequestAutoMerge(input:{pullRequestId:$pullRequestId, mergeMethod:SQUASH}) { pullRequest { id } } }' \
            >/dev/null

          echo "Enabled squash auto-merge." >> "$GITHUB_STEP_SUMMARY"
