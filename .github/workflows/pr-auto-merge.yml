name: PR Auto Merge

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  # Re-evaluate once the independent Reviewer Agent posts its result: the
  # pull_request_target events above fire before that check run exists, so
  # without this trigger a PR could sit "eligible but unreviewed" forever if
  # no further push ever happens.
  check_run:
    types:
      - completed

permissions:
  contents: write # Required for gh pr merge to perform an immediate squash merge.
  pull-requests: write
  # Deliberately does NOT include `checks: write`: this workflow can read
  # check runs (to ask whether the Reviewer Agent passed) but cannot create
  # or alter any check run itself, so it cannot forge the Reviewer Agent's
  # own result. See pr-reviewer-agent.yml and docs/reviewer-agent.md.

concurrency:
  group: pr-auto-merge-${{ github.event.pull_request.number || github.event.check_run.pull_requests[0].number || github.sha }}
  cancel-in-progress: true

jobs:
  enable-auto-merge:
    name: Enable auto-merge
    runs-on: ubuntu-latest

    steps:
      - name: Decide eligibility and merge safely
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER_FROM_EVENT: ${{ github.event.pull_request.number }}
          CHECK_RUN_NAME: ${{ github.event.check_run.name }}
          CHECK_RUN_PR_NUMBER: ${{ github.event.check_run.pull_requests[0].number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          set -euo pipefail

          owner="${BASE_REPO%%/*}"
          repo="${BASE_REPO##*/}"

          # check_run events don't carry PR context in the fields this script
          # otherwise reads from `github.event.pull_request.*`; resolve it
          # fresh from the API instead of trusting anything from the diff
          # that triggered the check run.
          if [[ "$EVENT_NAME" == "check_run" ]]; then
            if [[ "$CHECK_RUN_NAME" != "Reviewer Agent" ]]; then
              echo "Skipping: check_run event for '${CHECK_RUN_NAME:-<unknown>}', not Reviewer Agent." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [[ -z "$CHECK_RUN_PR_NUMBER" || "$CHECK_RUN_PR_NUMBER" == "null" ]]; then
              echo "Skipping: Reviewer Agent check run is not associated with an open pull request." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            PR_NUMBER="$CHECK_RUN_PR_NUMBER"
            pr_view_json="$(gh pr view "$PR_NUMBER" --repo "$BASE_REPO" --json baseRefName,headRepositoryOwner,headRepository,headRefOid,isDraft,author 2>/dev/null)" || {
              echo "Skipping: could not resolve pull request #${PR_NUMBER} for the check_run event (closed or inaccessible)." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            }
            BASE_REF="$(jq -r '.baseRefName' <<<"$pr_view_json")"
            HEAD_REPO="$(jq -r '((.headRepositoryOwner.login // "") + "/" + (.headRepository.name // ""))' <<<"$pr_view_json")"
            EVENT_HEAD_SHA="$(jq -r '.headRefOid' <<<"$pr_view_json")"
            DRAFT="$(jq -r '.isDraft' <<<"$pr_view_json")"
            AUTHOR="$(jq -r '.author.login' <<<"$pr_view_json")"
          else
            PR_NUMBER="$PR_NUMBER_FROM_EVENT"
          fi

          get_pr_state() {
            gh api graphql \
              -f owner="$owner" \
              -f repo="$repo" \
              -F number="$PR_NUMBER" \
              -f query='query($owner:String!, $repo:String!, $number:Int!) { repository(owner:$owner, name:$repo) { pullRequest(number:$number) { id state headRefOid mergeStateStatus autoMergeRequest { enabledAt } } } }'
          }

          # Independent reviewer gate: asks whether a Check Run named
          # "Reviewer Agent" completed successfully for this *exact* commit
          # SHA (see pr-reviewer-agent.yml). Querying the GitHub REST API by
          # SHA, every time, at every decision point, is what makes this
          # immune to staleness by construction: a check run created for an
          # older commit is never returned here once the head has moved,
          # because we always ask about the SHA we are deciding on right now.
          reviewer_status_for_sha() {
            local sha="$1"
            local checks_json
            if ! checks_json="$(gh api "repos/${BASE_REPO}/commits/${sha}/check-runs" 2>/dev/null)"; then
              echo "MISSING"
              return
            fi
            jq -r '
              ([.check_runs[]? | select(.name == "Reviewer Agent")]
                | sort_by(.completed_at // .started_at // "")) as $runs
              | if ($runs | length) == 0 then "MISSING"
                else
                  ($runs[-1]) as $latest
                  | if $latest.status != "completed" then "PENDING"
                    elif $latest.conclusion == "success" then "PASS"
                    elif $latest.conclusion == "failure" then "FAIL"
                    else "INCONCLUSIVE"
                    end
                end
            ' <<<"$checks_json"
          }

          write_pr_summary() {
            local state="$1"
            local head_sha="$2"
            local merge_state="$3"
            local reviewer_status="$4"
            local auto_merge_enabled="$5"

            {
              echo "## Trusted PR auto-merge decision"
              echo ""
              echo "- PR: #${PR_NUMBER}"
              echo "- Triggering event: ${EVENT_NAME}"
              echo "- Author: ${AUTHOR}"
              echo "- Draft: ${DRAFT}"
              echo "- Head repo: ${HEAD_REPO}"
              echo "- Base repo: ${BASE_REPO}"
              echo "- Base ref: ${BASE_REF}"
              echo "- Event head: ${EVENT_HEAD_SHA}"
              echo "- Current head: ${head_sha}"
              echo "- PR state: ${state}"
              echo "- Merge state (includes required CI checks): ${merge_state}"
              echo "- Reviewer Agent status for current head: ${reviewer_status}"
              echo "- Auto-merge already enabled: ${auto_merge_enabled:-false}"
            } >> "$GITHUB_STEP_SUMMARY"
          }

          fail_if_head_moved() {
            local current_head="$1"
            if [[ "$current_head" != "$EVENT_HEAD_SHA" ]]; then
              echo "::error::PR head moved from event SHA ${EVENT_HEAD_SHA} to ${current_head}; refusing to merge or enable auto-merge."
              return 1
            fi
          }

          maybe_disable_stale_auto_merge() {
            local auto_merge_enabled="$1"
            if [[ -n "$auto_merge_enabled" ]]; then
              gh pr merge "$PR_NUMBER" \
                --repo "$BASE_REPO" \
                --disable-auto
            fi
          }

          merge_clean_pr() {
            local pr_json current_head current_state merge_state reviewer_status auto_merge_enabled
            pr_json="$(get_pr_state)"
            current_head="$(jq -r '.data.repository.pullRequest.headRefOid' <<<"$pr_json")"
            current_state="$(jq -r '.data.repository.pullRequest.state' <<<"$pr_json")"
            merge_state="$(jq -r '.data.repository.pullRequest.mergeStateStatus' <<<"$pr_json")"
            auto_merge_enabled="$(jq -r '.data.repository.pullRequest.autoMergeRequest.enabledAt // empty' <<<"$pr_json")"

            fail_if_head_moved "$current_head" || return 1
            if [[ "$current_state" != "OPEN" ]]; then
              echo "::error::PR is no longer open; refusing to merge."
              return 1
            fi
            # Re-checked here (not just earlier in the job) because this is the
            # actual merge decision point: the Reviewer Agent's result could
            # have changed, or never existed, between the job's first state
            # read and this one. Always queried fresh, for the current head.
            reviewer_status="$(reviewer_status_for_sha "$current_head")"
            if [[ "$reviewer_status" != "PASS" ]]; then
              maybe_disable_stale_auto_merge "$auto_merge_enabled"
              echo "::notice::Reviewer Agent status is '${reviewer_status}' for ${current_head}, not PASS; refusing to merge."
              return 1
            fi
            if [[ "$merge_state" != "CLEAN" ]]; then
              return 2
            fi

            gh pr merge "$PR_NUMBER" \
              --repo "$BASE_REPO" \
              --squash \
              --match-head-commit "$EVENT_HEAD_SHA"
          }

          if [[ "$BASE_REF" != "main" ]]; then
            echo "Skipping: base ref is not main." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [[ "$DRAFT" == "true" ]]; then
            echo "Skipping: draft pull request." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [[ "$HEAD_REPO" != "$BASE_REPO" ]]; then
            echo "Skipping: fork pull request is not eligible for auto-merge." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          case "$AUTHOR" in
            RocketDelivery2|Copilot)
              ;;
            *)
              echo "Skipping: author '${AUTHOR}' is not in the trusted actor allowlist." >> "$GITHUB_STEP_SUMMARY"
              exit 0
              ;;
          esac

          pr_json="$(get_pr_state)"
          current_state="$(jq -r '.data.repository.pullRequest.state' <<<"$pr_json")"
          current_head="$(jq -r '.data.repository.pullRequest.headRefOid' <<<"$pr_json")"
          merge_state="$(jq -r '.data.repository.pullRequest.mergeStateStatus' <<<"$pr_json")"
          auto_merge_enabled="$(jq -r '.data.repository.pullRequest.autoMergeRequest.enabledAt // empty' <<<"$pr_json")"
          reviewer_status="$(reviewer_status_for_sha "$current_head")"

          write_pr_summary "$current_state" "$current_head" "$merge_state" "$reviewer_status" "$auto_merge_enabled"
          fail_if_head_moved "$current_head"

          if [[ "$current_state" != "OPEN" ]]; then
            echo "Skipping: PR is no longer open." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Deterministic merge gate (requirements 5 and 6): never proceed
          # unless the independent Reviewer Agent's result for the *exact*
          # current head commit is PASS. MISSING, PENDING, FAIL, and
          # INCONCLUSIVE are all treated identically here: refuse to merge or
          # enable auto-merge, and disable any auto-merge left enabled from a
          # head commit whose review no longer applies (now stale).
          if [[ "$reviewer_status" != "PASS" ]]; then
            echo "Skipping: Reviewer Agent status is '${reviewer_status}' for the current head, not PASS." >> "$GITHUB_STEP_SUMMARY"
            maybe_disable_stale_auto_merge "$auto_merge_enabled"
            if [[ -n "$auto_merge_enabled" ]]; then
              echo "Disabled existing auto-merge because the Reviewer Agent requirement is no longer satisfied." >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 0
          fi

          if [[ "$merge_state" == "CLEAN" ]]; then
            if merge_clean_pr; then
              echo "Merged clean PR with squash using the exact event head SHA." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            else
              merge_status=$?
              if [[ "$merge_status" -ne 2 ]]; then
                exit "$merge_status"
              fi
            fi
          fi

          if [[ -n "$auto_merge_enabled" ]]; then
            echo "Auto-merge is already enabled for the current head." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Re-fetch and re-check the Reviewer Agent status immediately before
          # enabling auto-merge: the merge_clean_pr attempt above may have
          # taken time, and this is the point where we actually ask GitHub to
          # let the PR merge unattended once required checks finish.
          reviewer_status="$(reviewer_status_for_sha "$current_head")"
          if [[ "$reviewer_status" != "PASS" ]]; then
            echo "Skipping: Reviewer Agent status is '${reviewer_status}' at the enable-auto-merge decision point." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if merge_error="$(gh pr merge "$PR_NUMBER" \
            --repo "$BASE_REPO" \
            --squash \
            --auto \
            --match-head-commit "$EVENT_HEAD_SHA" 2>&1)"; then
            echo "Enabled normal squash auto-merge for the pending PR." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "$merge_error" >&2
          pr_json="$(get_pr_state)"
          current_state="$(jq -r '.data.repository.pullRequest.state' <<<"$pr_json")"
          current_head="$(jq -r '.data.repository.pullRequest.headRefOid' <<<"$pr_json")"
          merge_state="$(jq -r '.data.repository.pullRequest.mergeStateStatus' <<<"$pr_json")"

          fail_if_head_moved "$current_head"
          reviewer_status="$(reviewer_status_for_sha "$current_head")"
          if [[ "$current_state" == "OPEN" && "$merge_state" == "CLEAN" && "$reviewer_status" == "PASS" ]]; then
            echo "PR became clean while auto-merge was being enabled; retrying as an exact-head squash merge." >> "$GITHUB_STEP_SUMMARY"
            merge_clean_pr
            exit 0
          fi

          echo "::error::Could not enable squash auto-merge and PR is not clean for an immediate merge."
          exit 1
