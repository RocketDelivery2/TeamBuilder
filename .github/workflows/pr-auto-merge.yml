name: PR Auto Merge

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  # Re-evaluate once the independent Reviewer Agent finishes: the
  # pull_request_target events above fire before its check run exists.
  # This is a workflow_run trigger, not check_run, because the Reviewer
  # Agent posts its check run with the default GITHUB_TOKEN, and GitHub
  # never starts workflows for events caused by that token. A check_run
  # trigger therefore only ever fired for other apps' checks (CodeQL,
  # dependency submission), and those runs shared this workflow's
  # concurrency group and cancelled the real evaluation. workflow_run fires
  # only when the "PR Reviewer Agent" workflow itself completes.
  workflow_run:
    workflows:
      - PR Reviewer Agent
    types:
      - completed

permissions:
  contents: write # Required for gh pr merge to perform an immediate squash merge.
  pull-requests: write
  # Deliberately does NOT include `checks: write`: this workflow can read
  # check runs (to ask whether the Reviewer Agent passed) but cannot create
  # or alter any check run itself, so it cannot forge the Reviewer Agent's
  # own result. See pr-reviewer-agent.yml and docs/reviewer-agent.md.

concurrency:
  group: pr-auto-merge-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_sha || github.run_id }}
  cancel-in-progress: true

jobs:
  enable-auto-merge:
    name: Enable auto-merge
    runs-on: ubuntu-latest

    steps:
      - name: Decide eligibility and merge safely
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER_FROM_EVENT: ${{ github.event.pull_request.number }}
          WORKFLOW_RUN_EVENT: ${{ github.event.workflow_run.event }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_RUN_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          set -euo pipefail

          owner="${BASE_REPO%%/*}"
          repo="${BASE_REPO##*/}"

          # Reads retry transient GitHub API failures (502/503, secondary rate
          # limits) instead of failing the run on the first error.
          # RETRY_DELAY_SECONDS exists so the mocked tests don't sleep.
          gh_retry() {
            local attempt=1 delay="${RETRY_DELAY_SECONDS:-2}"
            while true; do
              if "$@"; then
                return 0
              fi
              if [[ "$attempt" -ge 4 ]]; then
                return 1
              fi
              echo "::warning::GitHub API call failed (attempt ${attempt} of 4); retrying in ${delay}s." >&2
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }

          # workflow_run events don't carry the pull request fields this
          # script otherwise reads from `github.event.pull_request.*`, so
          # resolve them fresh from the API. The payload is only used to find
          # which PR and which reviewed commit the event is about.
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            if [[ "$WORKFLOW_RUN_EVENT" != "pull_request_target" ]]; then
              echo "Skipping: Reviewer Agent run was triggered by '${WORKFLOW_RUN_EVENT:-<unknown>}', not a pull request." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            PR_NUMBER="$WORKFLOW_RUN_PR_NUMBER"
            if [[ -z "$PR_NUMBER" || "$PR_NUMBER" == "null" ]]; then
              # workflow_run.pull_requests can be empty (for example for a
              # fork head). Fall back to the open PRs whose head is exactly
              # the reviewed commit, and act only when that is unambiguous.
              PR_NUMBER=""
              if pulls_json="$(gh_retry gh api "repos/${BASE_REPO}/commits/${WORKFLOW_RUN_HEAD_SHA}/pulls")"; then
                PR_NUMBER="$(jq -r --arg sha "$WORKFLOW_RUN_HEAD_SHA" --arg base "$BASE_REPO" '
                  [.[]? | select(.state == "open" and .head.sha == $sha and .base.repo.full_name == $base) | .number]
                  | if length == 1 then .[0] else "" end
                ' <<<"$pulls_json")"
              fi
              if [[ -z "$PR_NUMBER" ]]; then
                echo "Skipping: Reviewer Agent run is not associated with exactly one open pull request." >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            fi
            # REST, not `gh pr view`: the REST user.login matches the
            # pull_request_target payload exactly (gh pr view reports bots
            # as "app/<slug>"), so the trusted-author check means the same
            # thing for both triggers.
            pr_rest_json="$(gh_retry gh api "repos/${BASE_REPO}/pulls/${PR_NUMBER}" 2>/dev/null)" || {
              echo "Skipping: could not resolve pull request #${PR_NUMBER} for the workflow_run event (inaccessible)." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            }
            if [[ "$(jq -r '.state' <<<"$pr_rest_json")" != "open" ]]; then
              echo "Skipping: pull request #${PR_NUMBER} is no longer open." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            BASE_REF="$(jq -r '.base.ref' <<<"$pr_rest_json")"
            HEAD_REPO="$(jq -r '.head.repo.full_name // ""' <<<"$pr_rest_json")"
            EVENT_HEAD_SHA="$(jq -r '.head.sha' <<<"$pr_rest_json")"
            DRAFT="$(jq -r '.draft' <<<"$pr_rest_json")"
            AUTHOR="$(jq -r '.user.login' <<<"$pr_rest_json")"
            # A review that finished for an older commit says nothing about
            # the current head; that head's own review run will trigger
            # another evaluation when it completes.
            if [[ "$EVENT_HEAD_SHA" != "$WORKFLOW_RUN_HEAD_SHA" ]]; then
              echo "Skipping: Reviewer Agent run reviewed ${WORKFLOW_RUN_HEAD_SHA}, but the PR head is now ${EVENT_HEAD_SHA}." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          else
            PR_NUMBER="$PR_NUMBER_FROM_EVENT"
          fi

          get_pr_state() {
            gh_retry gh api graphql \
              -f owner="$owner" \
              -f repo="$repo" \
              -F number="$PR_NUMBER" \
              -f query='query($owner:String!, $repo:String!, $number:Int!) { repository(owner:$owner, name:$repo) { pullRequest(number:$number) { id state headRefOid mergeStateStatus autoMergeRequest { enabledAt } } } }'
          }

          # Independent reviewer gate: asks whether a Check Run named
          # "Reviewer Agent" completed successfully for this *exact* commit
          # SHA (see pr-reviewer-agent.yml). Querying the GitHub REST API by
          # SHA, every time, at every decision point, is what makes this
          # immune to staleness by construction: a check run created for an
          # older commit is never returned here once the head has moved,
          # because we always ask about the SHA we are deciding on right now.
          #
          # Matching is NOT done by check name alone: the check run must
          # also report app.slug == "github-actions" (the GitHub App
          # identity every Actions run authenticates as via the default
          # GITHUB_TOKEN) and the exact external_id pr-reviewer-agent.yml
          # tags its own check runs with. This rules out any check run that
          # did not come from a GitHub Actions run using the default token
          # in this repository (e.g. a stale check from a renamed/removed
          # integration, or a differently-named-but-similar check created by
          # an unrelated tool). It does NOT, by itself, prove the check run
          # came specifically from pr-reviewer-agent.yml rather than some
          # other workflow file in this same repository also using the
          # default token -- see docs/reviewer-agent.md for the full,
          # honest trust-boundary analysis and the recommended follow-up
          # (a dedicated credential) that would close that remaining gap.
          #
          # The query filters by check name server-side so a commit with more
          # than one page of check runs cannot push the Reviewer Agent's run
          # out of the response. If a review was re-run, the most recently
          # created matching run decides. A read that still fails after
          # retries reports UNAVAILABLE, which never merges and never
          # disarms auto-merge, so a GitHub outage cannot undo a valid review.
          reviewer_status_for_sha() {
            local sha="$1"
            local checks_json
            if ! checks_json="$(gh_retry gh api "repos/${BASE_REPO}/commits/${sha}/check-runs?check_name=Reviewer%20Agent&filter=all&per_page=100" 2>/dev/null)"; then
              echo "UNAVAILABLE"
              return
            fi
            jq -r '
              ([.check_runs[]? | select(
                  .name == "Reviewer Agent"
                  and ((.app.slug // "") == "github-actions")
                  and ((.external_id // "") == "teambuilder-pr-reviewer-agent")
                )]
                | sort_by([(.started_at // ""), (.id // 0)])) as $runs
              | if ($runs | length) == 0 then "MISSING"
                else
                  ($runs[-1]) as $latest
                  | if $latest.status != "completed" then "PENDING"
                    elif $latest.conclusion == "success" then "PASS"
                    elif $latest.conclusion == "failure" then "FAIL"
                    else "INCONCLUSIVE"
                    end
                end
            ' <<<"$checks_json"
          }

          fail_if_reviewer_unavailable() {
            if [[ "$1" == "UNAVAILABLE" ]]; then
              echo "Could not read the Reviewer Agent result after retries; no merge decision was made." >> "$GITHUB_STEP_SUMMARY"
              echo "::error::Could not read the Reviewer Agent check run for the current head; refusing to merge."
              exit 1
            fi
          }

          write_pr_summary() {
            local state="$1"
            local head_sha="$2"
            local merge_state="$3"
            local reviewer_status="$4"
            local auto_merge_enabled="$5"

            {
              echo "## Trusted PR auto-merge decision"
              echo ""
              echo "- PR: #${PR_NUMBER}"
              echo "- Triggering event: ${EVENT_NAME}"
              echo "- Author: ${AUTHOR}"
              echo "- Draft: ${DRAFT}"
              echo "- Head repo: ${HEAD_REPO}"
              echo "- Base repo: ${BASE_REPO}"
              echo "- Base ref: ${BASE_REF}"
              echo "- Event head: ${EVENT_HEAD_SHA}"
              echo "- Current head: ${head_sha}"
              echo "- PR state: ${state}"
              echo "- Merge state (includes required CI checks): ${merge_state}"
              echo "- Reviewer Agent status for current head: ${reviewer_status}"
              echo "- Auto-merge already enabled: ${auto_merge_enabled:-false}"
            } >> "$GITHUB_STEP_SUMMARY"
          }

          fail_if_head_moved() {
            local current_head="$1"
            if [[ "$current_head" != "$EVENT_HEAD_SHA" ]]; then
              echo "::error::PR head moved from event SHA ${EVENT_HEAD_SHA} to ${current_head}; refusing to merge or enable auto-merge."
              return 1
            fi
          }

          maybe_disable_stale_auto_merge() {
            local auto_merge_enabled="$1"
            if [[ -n "$auto_merge_enabled" ]]; then
              gh pr merge "$PR_NUMBER" \
                --repo "$BASE_REPO" \
                --disable-auto
            fi
          }

          merge_clean_pr() {
            local pr_json current_head current_state merge_state reviewer_status auto_merge_enabled
            pr_json="$(get_pr_state)"
            current_head="$(jq -r '.data.repository.pullRequest.headRefOid' <<<"$pr_json")"
            current_state="$(jq -r '.data.repository.pullRequest.state' <<<"$pr_json")"
            merge_state="$(jq -r '.data.repository.pullRequest.mergeStateStatus' <<<"$pr_json")"
            auto_merge_enabled="$(jq -r '.data.repository.pullRequest.autoMergeRequest.enabledAt // empty' <<<"$pr_json")"

            fail_if_head_moved "$current_head" || return 1
            if [[ "$current_state" != "OPEN" ]]; then
              echo "::error::PR is no longer open; refusing to merge."
              return 1
            fi
            # Re-checked here (not just earlier in the job) because this is the
            # actual merge decision point: the Reviewer Agent's result could
            # have changed, or never existed, between the job's first state
            # read and this one. Always queried fresh, for the current head.
            reviewer_status="$(reviewer_status_for_sha "$current_head")"
            fail_if_reviewer_unavailable "$reviewer_status"
            if [[ "$reviewer_status" != "PASS" ]]; then
              maybe_disable_stale_auto_merge "$auto_merge_enabled"
              echo "::notice::Reviewer Agent status is '${reviewer_status}' for ${current_head}, not PASS; refusing to merge."
              return 1
            fi
            if [[ "$merge_state" != "CLEAN" ]]; then
              return 2
            fi

            gh pr merge "$PR_NUMBER" \
              --repo "$BASE_REPO" \
              --squash \
              --match-head-commit "$EVENT_HEAD_SHA"
          }

          if [[ "$BASE_REF" != "main" ]]; then
            echo "Skipping: base ref is not main." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [[ "$DRAFT" == "true" ]]; then
            echo "Skipping: draft pull request." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [[ "$HEAD_REPO" != "$BASE_REPO" ]]; then
            echo "Skipping: fork pull request is not eligible for auto-merge." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          case "$AUTHOR" in
            RocketDelivery2|Copilot)
              ;;
            *)
              echo "Skipping: author '${AUTHOR}' is not in the trusted actor allowlist." >> "$GITHUB_STEP_SUMMARY"
              exit 0
              ;;
          esac

          pr_json="$(get_pr_state)"
          current_state="$(jq -r '.data.repository.pullRequest.state' <<<"$pr_json")"
          current_head="$(jq -r '.data.repository.pullRequest.headRefOid' <<<"$pr_json")"
          merge_state="$(jq -r '.data.repository.pullRequest.mergeStateStatus' <<<"$pr_json")"
          auto_merge_enabled="$(jq -r '.data.repository.pullRequest.autoMergeRequest.enabledAt // empty' <<<"$pr_json")"
          reviewer_status="$(reviewer_status_for_sha "$current_head")"

          write_pr_summary "$current_state" "$current_head" "$merge_state" "$reviewer_status" "$auto_merge_enabled"
          fail_if_head_moved "$current_head"

          if [[ "$current_state" != "OPEN" ]]; then
            echo "Skipping: PR is no longer open." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          fail_if_reviewer_unavailable "$reviewer_status"

          # Deterministic merge gate (requirements 5 and 6): never proceed
          # unless the independent Reviewer Agent's result for the *exact*
          # current head commit is PASS. MISSING, PENDING, FAIL, and
          # INCONCLUSIVE are all treated identically here: refuse to merge or
          # enable auto-merge, and disable any auto-merge left enabled from a
          # head commit whose review no longer applies (now stale).
          if [[ "$reviewer_status" != "PASS" ]]; then
            echo "Skipping: Reviewer Agent status is '${reviewer_status}' for the current head, not PASS." >> "$GITHUB_STEP_SUMMARY"
            maybe_disable_stale_auto_merge "$auto_merge_enabled"
            if [[ -n "$auto_merge_enabled" ]]; then
              echo "Disabled existing auto-merge because the Reviewer Agent requirement is no longer satisfied." >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 0
          fi

          # A conflicted PR can neither merge now nor ever satisfy native
          # auto-merge until someone resolves it; say so instead of failing on
          # a rejected auto-merge request.
          if [[ "$merge_state" == "DIRTY" ]]; then
            echo "Skipping: PR has a merge conflict with main." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [[ "$merge_state" == "CLEAN" ]]; then
            if merge_clean_pr; then
              echo "Merged clean PR with squash using the exact event head SHA." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            else
              merge_status=$?
              if [[ "$merge_status" -ne 2 ]]; then
                exit "$merge_status"
              fi
            fi
          fi

          if [[ -n "$auto_merge_enabled" ]]; then
            echo "Auto-merge is already enabled for the current head." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Re-fetch and re-check the Reviewer Agent status immediately before
          # enabling auto-merge: the merge_clean_pr attempt above may have
          # taken time, and this is the point where we actually ask GitHub to
          # let the PR merge unattended once required checks finish.
          reviewer_status="$(reviewer_status_for_sha "$current_head")"
          fail_if_reviewer_unavailable "$reviewer_status"
          if [[ "$reviewer_status" != "PASS" ]]; then
            echo "Skipping: Reviewer Agent status is '${reviewer_status}' at the enable-auto-merge decision point." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if merge_error="$(gh pr merge "$PR_NUMBER" \
            --repo "$BASE_REPO" \
            --squash \
            --auto \
            --match-head-commit "$EVENT_HEAD_SHA" 2>&1)"; then
            echo "Enabled normal squash auto-merge for the pending PR." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "$merge_error" >&2
          pr_json="$(get_pr_state)"
          current_state="$(jq -r '.data.repository.pullRequest.state' <<<"$pr_json")"
          current_head="$(jq -r '.data.repository.pullRequest.headRefOid' <<<"$pr_json")"
          merge_state="$(jq -r '.data.repository.pullRequest.mergeStateStatus' <<<"$pr_json")"

          fail_if_head_moved "$current_head"
          reviewer_status="$(reviewer_status_for_sha "$current_head")"
          if [[ "$current_state" == "OPEN" && "$merge_state" == "CLEAN" && "$reviewer_status" == "PASS" ]]; then
            echo "PR became clean while auto-merge was being enabled; retrying as an exact-head squash merge." >> "$GITHUB_STEP_SUMMARY"
            merge_clean_pr
            exit 0
          fi

          echo "::error::Could not enable squash auto-merge and PR is not clean for an immediate merge."
          exit 1
