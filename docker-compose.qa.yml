# Local private-QA stack (ASPNETCORE_ENVIRONMENT=LocalQA): SQL Server + migration bundle +
# TeamBuilder API + web client, for local or private testing only. It signs in with developer
# tokens; the deployed QA topology with real OIDC and HTTPS is deploy/compose/ (see
# docs/qa/private-qa-deployment.md). Secrets come from a git-ignored .env file next to this one (see docs/private-qa.md):
#   TEAMBUILDER_QA_SQL_PASSWORD   SQL Server sa password (SQL Server complexity rules apply)
#   TEAMBUILDER_JWT_SIGNING_KEY   symmetric key (32+ bytes) the API validates dev tokens with
# Optional browser alerts (Web Push); off unless all four are set (docs/private-qa.md):
#   TEAMBUILDER_WEBPUSH_ENABLED=true, TEAMBUILDER_WEBPUSH_SUBJECT (mailto: or https: contact),
#   TEAMBUILDER_VAPID_PUBLIC_KEY, TEAMBUILDER_VAPID_PRIVATE_KEY (generate with
#   `dotnet run --project src/TeamBuilder.Api -- outbox vapid-keys`, or `exec api dotnet
#   TeamBuilder.Api.dll outbox vapid-keys` in the running stack)
# Start with: docker compose -f docker-compose.qa.yml up --build
# The migrate service applies the EF Core migration bundle and exits before the API starts;
# the API itself never changes the schema here either.
name: teambuilder-qa

services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${TEAMBUILDER_QA_SQL_PASSWORD:?Set TEAMBUILDER_QA_SQL_PASSWORD in .env}
    volumes:
      - sql-data:/var/opt/mssql
    networks:
      - qa
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    depends_on:
      sql:
        condition: service_healthy
    environment:
      ConnectionStrings__TeamBuilderSql: Server=sql;Database=TeamBuilderQA;User Id=sa;Password=${TEAMBUILDER_QA_SQL_PASSWORD};Encrypt=True;TrustServerCertificate=True
    networks:
      - qa
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    depends_on:
      sql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: LocalQA
      ConnectionStrings__TeamBuilderSql: Server=sql;Database=TeamBuilderQA;User Id=sa;Password=${TEAMBUILDER_QA_SQL_PASSWORD};Encrypt=True;TrustServerCertificate=True
      AllowedOrigins: http://localhost:8080
      Jwt__Authority: ""
      Jwt__SigningKey: ${TEAMBUILDER_JWT_SIGNING_KEY:?Set TEAMBUILDER_JWT_SIGNING_KEY in .env}
      Jwt__Issuer: teambuilder-local-qa
      Jwt__Audience: teambuilder-api
      Jwt__RequireHttpsMetadata: "false"
      # The web container's nginx is the only proxy trusted to set X-Forwarded-For, so
      # per-IP rate limits see the real client; a header from anyone else is ignored.
      ForwardedHeaders__Enabled: "true"
      ForwardedHeaders__KnownProxies__0: 172.29.80.10
      WebPush__Enabled: ${TEAMBUILDER_WEBPUSH_ENABLED:-false}
      WebPush__Subject: ${TEAMBUILDER_WEBPUSH_SUBJECT:-}
      WebPush__VapidPublicKey: ${TEAMBUILDER_VAPID_PUBLIC_KEY:-}
      WebPush__VapidPrivateKey: ${TEAMBUILDER_VAPID_PRIVATE_KEY:-}
    healthcheck:
      test: ["CMD", "dotnet", "TeamBuilder.Api.dll", "healthcheck", "ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - qa
    ports:
      - "5080:8080"

  web:
    build:
      context: apps/TeamBuilder.Web
      args:
        # Local QA image: offers developer-token sign-in (with a visible banner). The deployed
        # QA stack (deploy/compose) builds without it and signs in through the OIDC provider.
        VITE_ALLOW_DEV_TOKEN: "true"
        VITE_OIDC_AUTHORITY: ${TEAMBUILDER_QA_OIDC_AUTHORITY:-}
        VITE_OIDC_CLIENT_ID: ${TEAMBUILDER_QA_OIDC_CLIENT_ID:-}
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_UPSTREAM: http://api:8080
      TEAMBUILDER_ENVIRONMENT: local
    networks:
      qa:
        ipv4_address: 172.29.80.10
    ports:
      - "8080:80"

networks:
  qa:
    ipam:
      config:
        - subnet: 172.29.80.0/24

volumes:
  sql-data:
